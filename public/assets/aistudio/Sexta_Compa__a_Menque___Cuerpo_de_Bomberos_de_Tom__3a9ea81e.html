.st b{display:block;font:700 32px/1.1 'Barlow Condensed',sans-serif}.st span{color:var(--mut);font-size:13px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.8rem 1rem;margin-bottom:.7rem}
.card header{display:flex;gap:.7rem;align-items:baseline;flex-wrap:wrap}.card header button{margin-left:auto}.card p{margin:.3rem 0;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:.3rem 0}.chips i{font-style:normal;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:13px}small,.note{color:var(--mut);font-size:13px}
.al{display:flex;gap:.6rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--line)}.al span{flex:1}
.cl{margin:.5rem 0}.cl div{display:flex;justify-content:space-between;font-size:14px}.cl u{display:block;height:8px;background:var(--navy);border-radius:4px;margin-top:3px}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:.5rem .7rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:13px}
.act button{padding:.15rem .5rem;font-size:13px;margin-right:3px}
.b{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--mut);white-space:nowrap}.b.r{background:var(--br);color:var(--red)}.b.a{background:var(--ba);color:var(--amb)}.b.o{background:var(--bo);color:var(--ok)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.8rem}.tabs .on{background:var(--navy);color:#fff;border-color:var(--navy)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:min(520px,94vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#0008}
dialog h2{margin-bottom:.4rem}dialog label{display:block;margin:.5rem 0;font-size:13px;color:var(--mut)}
input,select{width:100%;font:inherit;padding:.4rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
fieldset{border:1px solid var(--line);border-radius:6px;margin:.6rem 0}.chk{display:grid;grid-template-columns:1fr 1fr;gap:2px}.chk label{display:flex;gap:6px;align-items:center;margin:0;color:var(--ink)}.chk input{width:auto}
.row{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.8rem}#qrb{display:grid;place-items:center;padding:.8rem;background:#fff;border-radius:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:.5rem 1rem;border-radius:8px;display:none;max-width:90vw}
.empty{padding:1.5rem;text-align:center}
.card,.scroll,.st{background:color-mix(in srgb,var(--card) 88%,transparent)}
.qf{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:.6rem;align-items:end;margin:.5rem 0}.qf label{font-size:13px;color:var(--mut);margin:0}@media(max-width:560px){.qf{grid-template-columns:1fr 1fr}}
img.ph{border-style:solid;object-fit:cover}
.idc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.card1{width:85.6mm;height:54mm;border:1px solid #14202e;border-radius:3mm;overflow:hidden;background:#fff;color:#14202e;display:flex;flex-direction:column;font-size:9px;line-height:1.3;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.card1 .hd{background:#c8102e;color:#fff;padding:1.4mm 2.5mm;display:flex;align-items:center;gap:2mm;font-weight:700;font-size:7.5px}.card1 .hd img{height:8mm}
.card1 .bd{padding:2mm 2.5mm;flex:1;display:flex;gap:2.5mm;min-height:0}.card1 .nm{font:700 13px/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase;margin-bottom:1mm}
.card1 .ft{background:#16263d;color:#fff;text-align:center;font-size:7px;padding:1mm}
.ph{width:20mm;height:25mm;border:1px dashed #8a97a6;display:grid;place-items:center;font-size:7px;color:#6b7a8a;flex:none}
#qk{width:30mm;flex:none}#qk img,#qk canvas{width:100%!important;height:auto!important}
.fi{background:#fff;color:#14202e;padding:4mm;font-size:13px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.fi table{width:100%;margin-top:8px}.fi td{white-space:normal;padding:.35rem .5rem}.fi td:first-child{width:40%;color:#555;font-weight:600}
@media print{body>*:not(dialog){display:none!important}body::before{display:none!important}dialog{position:static!important;border:0!important;width:auto!important;max-height:none!important;overflow:visible!important;background:#fff!important}dialog::backdrop{display:none}.noprint{display:none!important}}

function ingresar(){const c=$('#qc').value.trim(),n=parseInt($('#qn').value,10)||0,sal=$('#qt').value==='Salida';

function form(title,fs,cb){const d=$('#dlg');d.innerHTML=`<form method="dialog"><h2>${title}</h2>`+fs.map(f=>f.t==='chk'?`<fieldset><legend>${f.l}</legend><div class="chk">${S.per.map(p=>`<label><input type="checkbox" name="${f.k}" value="${p.run}">${esc(short(p.nombre))}</label>`).join('')}</div></fieldset>`:`<label>${f.l}${f.t==='sel'?`<select name="${f.k}">${f.o.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${v===f.v?' selected':''}>${esc(l)}</option>`}).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}" ${f.r?'required':''}>`}</label>`).join('')+`<div class="row"><button value="c" formnovalidate>Cancelar</button><button value="ok" class="p">Guardar</button></div></form>`;

function edit(k,i,pre){const nw=i===undefined,cur=nw?(pre||{}):S[k][i],fs=(FS[k]?FS[k]():T[k].c.map(([f,l,ty],j)=>({k:f,l,r:j===0,t:ty==='n'?'number':ty?'date':'text'}))).map(f=>({...f,v:cur[f.k]??f.v??''}));

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const g=a=>(b.dataset[a]||'').split(':'),v=b.dataset.v;
if(v){V=v;render()}else if(b.dataset.sub){SUB=b.dataset.sub;render()}else if(b.dataset.new)edit(b.dataset.new);else if(b.dataset.ed){const[k,i]=g('ed');edit(k,+i)}else if(b.dataset.qr){const[k,i]=g('qr');qr(k,+i)}
else if(b.dataset.del){if(b.dataset.arm){const[k,i]=g('del');S[k].splice(+i,1);save();render()}else{b.dataset.arm=1;b.textContent='¿Seguro?';setTimeout(()=>{delete b.dataset.arm;b.textContent='Borrar'},3000)}}
else if(b.dataset.cell){const[r,e]=b.dataset.cell.split('|'),i=S.epp.findIndex(a=>a.run===r&&a.equipo===e);i>=0?edit('epp',i):edit('epp',undefined,{run:r,equipo:e})}
else if(b.id==='rst'){if(b.dataset.arm){S=structuredClone(D0);save();render();toast('Datos restablecidos');delete b.dataset.arm;b.textContent='Restablecer datos'}else{b.dataset.arm=1;b.textContent='¿Borrar cambios?';setTimeout(()=>{delete b.dataset.arm;b.textContent='Restablecer datos'},3000)}}
else if(b.id==='imp')$('#file').click();else if(b.id==='exp')exportar();else if(b.id==='qg')ingresar();else if(b.id==='pr')printIt();else if(b.id==='pfb')$('#pf').click();else if(b.id==='pfx'){delete S.per[FI].foto;save();tarjeta(FI);toast('Foto quitada')}else if(b.dataset.fp)ficha(+b.dataset.fp);else if(b.dataset.tj)tarjeta(+b.dataset.tj)});

const ar=(L,C)=>L.flatMap(a=>(a.run.length?a.run:['']).map(r=>({...Object.fromEntries(Object.entries(C).map(([k,h])=>[h,k==='run'?r:k==='fecha'?fx(a.fecha):a[k]])),Voluntario:r?nm(r):''})));
add(ar(S.act,AC),'Bitácora Emergencias');add(ar(S.cit,CC),'Asistencia Citaciones');if((S.mov||[]).length)add(S.mov.map(m=>({Fecha:m.f,Lista:m.k==='era'?'Material menor y ERA':'Inventario general','Código':m.cod,Movimiento:m.tipo,Cantidad:m.cant,'Stock resultante':m.stock})),'Movimientos Inventario');
try{const bin=XLSX.write(wb,{type:'array',bookType:'xlsx'}),F='gestion-bomberos-6ta.xlsx';if(dl)await dl.save({filename:F,data:bin});else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bin]));a.download=F;a.click()}toast('Excel exportado')}catch(e){if(e.code!=='declined')toast('No se pudo exportar el archivo.')}}
const dI=v=>{if(typeof v==='number')return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);v=String(v||'');let m=v.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):/^\d{4}-\d\d-\d\d/.test(v)?v.slice(0,10):''};

['per','mat','era','far','inv','car','epp'].forEach(k=>{const t=T[k],ws=wb.Sheets[t.s];if(!ws)return;N[k]=XLSX.utils.sheet_to_json(ws,{defval:''}).filter(r=>String(r[t.c[0][1]]).trim()!=='').map(r=>Object.fromEntries(t.c.map(([f,l,ty])=>[f,ty==='d'||ty==='f'?dI(r[l]):ty==='n'?(Number(r[l])||0):String(r[l]).trim()])));got.push(N[k].length+' '+t.t.toLowerCase())});

const a=grp('Bitácora Emergencias',AC),c=grp('Asistencia Citaciones',CC);if(a){N.act=a;got.push(a.length+' emergencias')}if(c){N.cit=c;got.push(c.length+' citaciones')}
if(!got.length){S=keep;return toast('El archivo no tiene las hojas esperadas.')}S=N;save();render();toast('Importado: '+got.join(', '))}catch(x){toast('No se pudo leer el archivo Excel.')}};
